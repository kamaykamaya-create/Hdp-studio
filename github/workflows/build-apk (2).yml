name: Build APK HDP Studio

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Ekstrak HDP-1.zip & HDP-2.zip
        run: |
          ls -la
          for z in HDP-1.zip HDP-2.zip; do
            [ -f "$z" ] || { echo "::error::File $z belum diunggah ke repository (taruh di halaman utama repo)."; exit 1; }
          done
          mkdir -p app/www app/assets
          unzip -o -q HDP-1.zip -d app/www
          unzip -o -q HDP-2.zip -d app/www
          mv app/www/_build/icon-only.png app/assets/icon-only.png
          mv app/www/_build/splash.png app/assets/splash.png
          mv app/www/_build/icon-foreground.png app/assets/icon-foreground.png
          mv app/www/_build/icon-background.png app/assets/icon-background.png
          cp app/assets/splash.png app/assets/splash-dark.png
          rmdir app/www/_build
          [ -f app/www/index.html ] || { echo "::error::index.html tidak ditemukan di HDP-1.zip"; exit 1; }
          N=$(ls app/www/music/*.mp3 | wc -l); echo "Musik: $N file"
          [ "$N" -eq 9 ] || { echo "::error::Musik harus 9 file, ditemukan $N"; exit 1; }

      - name: Siapkan proyek Capacitor
        working-directory: app
        run: |
          cat > package.json <<'JSON'
          {
            "name": "hdp-studio",
            "version": "2.4.1",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.2.3",
              "@capacitor/core": "6.2.3",
              "@capacitor/filesystem": "6.0.4",
              "@capacitor/share": "6.0.4",
              "@ffmpeg/core": "0.12.6",
              "@ffmpeg/ffmpeg": "0.12.10",
              "@ffmpeg/util": "0.12.1"
            },
            "devDependencies": {
              "@capacitor/assets": "3.0.5",
              "@capacitor/cli": "6.2.3"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.hadiansyah.hdpstudio",
            "appName": "HDP Studio",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": false, "captureInput": true },
            "plugins": { "SplashScreen": { "launchShowDuration": 600, "backgroundColor": "#0a1430" } }
          }
          JSON
          npm install --no-audit --no-fund

      - name: Salin mesin MP4 (offline)
        working-directory: app
        run: |
          mkdir -p www/ffmpeg
          cp node_modules/@ffmpeg/ffmpeg/dist/umd/ffmpeg.js node_modules/@ffmpeg/ffmpeg/dist/umd/814.ffmpeg.js www/ffmpeg/
          cp node_modules/@ffmpeg/util/dist/umd/index.js www/ffmpeg/util.js
          cp node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.js node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.wasm www/ffmpeg/

      - name: Buat proyek Android + izin mikrofon
        working-directory: app
        run: |
          npx cap add android
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $MAN
          grep -q RECORD_AUDIO $MAN && echo "Izin mikrofon OK"

      - name: Ikon & splash
        working-directory: app
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0a1430' --iconBackgroundColorDark '#0a1430' --splashBackgroundColor '#0a1430' --splashBackgroundColorDark '#0a1430'

      - name: Build APK
        working-directory: app
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../HDP-Studio-v2.4.1.apk

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: HDP-Studio-APK
          path: HDP-Studio-v2.4.1.apk
